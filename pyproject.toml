[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "autodl-fresh"
version = "0.7.6"
description = "AutoDL 实例保活与 GPU 候租桌面助手"
authors = [{name = "wanfeng562-code"}]
license = "LicenseRef-AutoDLFresh-NonCommercial-1.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/third-party/**/*"]
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7", "playwright>=1.60,<2"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9", "pyinstaller>=6", "certifi>=2025"]

[project.gui-scripts]
autodl-fresh = "autodl_fresh.app:main"

[tool.setuptools.packages.find]
include = ["autodl_fresh*"]

[tool.setuptools.package-data]
autodl_fresh = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
